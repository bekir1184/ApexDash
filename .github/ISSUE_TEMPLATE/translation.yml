name: Translation
description: Add or improve a language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Español
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: New language, or corrections to an existing one? See "Adding a language" in CONTRIBUTING.md.
