name: Feature request
description: Suggest a dashboard, a setting or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and why the app does not cover it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Sketches and photos of real wheel displays are very welcome.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
