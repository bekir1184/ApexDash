name: Support a new game
description: Request or volunteer to add telemetry for another racing game
labels: [new game]
body:
  - type: input
    id: game
    attributes:
      label: Game
      placeholder: Forza Motorsport
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Telemetry output
      description: How does the game send telemetry? Link the official documentation or a community reference.
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: Platforms
      placeholder: PC, Xbox
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      description: See docs/ADDING_A_GAME.md
      options:
        - label: I would like to implement it
        - label: I own the game and can test or record packets
