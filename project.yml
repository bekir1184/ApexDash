name: ApexDash
options:
  bundleIdPrefix: com.bekirersever
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "7NGN8D3PYY"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ApexDash:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Apex Dash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Laptoptaki sayfada duran QR kodu okuyup turlari oraya gondermek icin kamera gerekiyor."
        NSLocalNetworkUsageDescription: "F1 oyunundan gelen telemetri paketlerini yerel agdan dinlemek icin gerekli."
        UIAppFonts:
          - Saira-Regular.ttf
          - Saira-Medium.ttf
          - Saira-SemiBold.ttf
          - Saira-Bold.ttf
          - Saira-ExtraBold.ttf
          - Saira-Black.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bekirersever.apexdash
        TARGETED_DEVICE_FAMILY: "1,2"
  ApexDashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ApexDash
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
