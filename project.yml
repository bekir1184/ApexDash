name: ApexDash
options:
  bundleIdPrefix: com.bekirersever
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "7NGN8D3PYY"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ApexDash:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bekirersever.apexdash
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Apex Dash
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Laptoptaki sayfada duran QR kodu okuyup turlari oraya gondermek icin kamera gerekiyor."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "F1 26 oyunundan gelen telemetri paketlerini yerel agdan dinlemek icin gerekli."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
  ApexDashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ApexDash
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
