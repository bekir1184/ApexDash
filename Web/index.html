<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Dash · Telemetry</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Design principle: the answer first, details later.
     1. Session — best lap, theoretical best, top speed and the lap list.
     2. Lap     — the selected lap's map, speed / pedal / delta charts.
     3. Detail  — other channels, corners and energy; opened on demand.
     Looks like the app: navy background, two slanted stripes, red accent, Saira. */
  :root {
    --bg: #121219; --panel: rgba(26,26,35,.92); --raise: #21212c; --line: rgba(255,255,255,.08);
    --stripe: #292933;
    --ink: #f1f2f5; --dim: #8a8a9c; --faint: #5d5d6e; --accent: #e10600;
    /* Data colours carry meaning. */
    --purple: #b45cff; --green: #3ce85a; --yellow: #f5d92b; --red: #ff4438; --blue: #4aa3ff;
    --lapA: #3fd9c9; --lapB: #ff7a3d;
    --radius: 14px; --gutter: 20px;
  }
  @media (max-width: 600px) { :root { --gutter: 16px; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); position: relative;
         font: 14px/1.45 "Saira", -apple-system, "Segoe UI", system-ui, sans-serif;
         font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  body::before {
    content: ""; position: fixed; inset: -20vh -20vw; z-index: -1; pointer-events: none;
    background:
      linear-gradient(110.3deg, transparent 28%, var(--stripe) 28%, var(--stripe) 39%, transparent 39%),
      linear-gradient(110.3deg, transparent 46%, var(--stripe) 46%, var(--stripe) 57%, transparent 57%);
  }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: var(--gutter); }
  .label { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .purple { color: var(--purple); } .green { color: var(--green); } .yellow { color: var(--yellow); } .red { color: var(--red); }

  /* ---- top bar */
  .top { position: sticky; top: 0; z-index: 10; background: rgba(18,18,25,.9); backdrop-filter: blur(14px);
         -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 16px; height: 58px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 900;
           letter-spacing: .3em; white-space: nowrap; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; }
  .brand span { color: var(--accent); }
  .status { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 12px;
            font-weight: 600; color: var(--dim); white-space: nowrap; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .status.live i { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status.error i { background: var(--red); box-shadow: 0 0 8px var(--red); }

  main { padding-block: 24px 48px; display: flex; flex-direction: column; gap: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .panel-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px;
                border-bottom: 1px solid var(--line); }
  .panel-head h3 { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .panel-head .end { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .panel-body { padding: 16px 18px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--dim); padding: 6px 11px; font-size: 10.5px; font-weight: 700;
                letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: rgba(225,6,0,.2); color: #fff; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--raise); border: 1px solid var(--line);
         border-radius: 999px; padding: 7px 14px; font-size: 11px; font-weight: 700; letter-spacing: .1em;
         text-transform: uppercase; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; border-color: var(--line); }
  select.btn { appearance: none; -webkit-appearance: none; padding-right: 30px;
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

  /* ---- pairing */
  .pair { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: center; padding: 32px;
          max-width: 820px; margin: 6vh auto 0; width: 100%; }
  .pair .qr img { display: block; width: 208px; height: 208px; image-rendering: pixelated; background: #fff;
                  padding: 10px; border-radius: 12px; }
  .pair h2 { margin: 2px 0 0; font-size: 44px; line-height: 1.1; font-weight: 900; letter-spacing: .22em; color: var(--accent); }
  .pair ol { margin: 18px 0 20px; padding-left: 20px; color: var(--dim); display: grid; gap: 6px; }
  .pair ol b { color: var(--ink); font-weight: 700; }
  @media (max-width: 640px) {
    .pair { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 24px 20px; gap: 20px; }
    .pair ol { text-align: left; }
    .pair h2 { font-size: 34px; }
  }

  /* ---- title area */
  .context { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .context h2 { margin: 2px 0 0; font-size: 34px; line-height: 1.05; font-weight: 900; letter-spacing: .02em; text-transform: uppercase; }
  .context p { margin: 4px 0 0; color: var(--dim); }
  .context .end { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 600px) { .context h2 { font-size: 26px; } }

  /* ---- key values */
  .hero { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 900px) { .hero { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 16px 18px 15px; min-width: 0; text-align: left; overflow: hidden; }
  button.card { cursor: pointer; transition: border-color .15s; }
  button.card:hover { border-color: rgba(225,6,0,.6); }
  .card.key::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
                      border-radius: 0 3px 3px 0; background: var(--accent); }
  .card .value { display: block; margin-top: 6px; font-size: 32px; line-height: 1.05; font-weight: 800;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .value small { font-size: 14px; font-weight: 600; color: var(--dim); margin-left: 4px; }
  .card .sub { display: block; margin-top: 6px; font-size: 12px; color: var(--dim); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .hero.compact .card .value { font-size: 24px; }
  @media (max-width: 600px) {
    .hero { gap: 10px; }
    .card { padding: 13px 14px; }
    .card .value { font-size: 24px; }
    .hero.compact .card .value { font-size: 20px; }
  }

  /* ---- lap list: fixed columns, no overflow */
  .laps { display: flex; flex-direction: column; }
  .lap-row { display: grid; align-items: center; gap: 14px; width: 100%; padding: 10px 18px; background: none;
             border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer;
             grid-template-columns: 2.6rem 6.4rem minmax(0, 1fr) 13.5rem 4.6rem 0.8rem; }
  .lap-row:last-child { border-bottom: 0; }
  .lap-row:hover { background: rgba(255,255,255,.035); }
  .lap-row.head { cursor: default; padding-block: 9px; }
  .lap-row.head:hover { background: none; }
  .lap-row.head span { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .lap-row .no { color: var(--dim); font-weight: 600; }
  .lap-row .time { font-size: 16px; font-weight: 700; }
  .lap-row.best .time { color: var(--purple); }
  .lap-row .gap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .lap-row .gap .bar { flex: 1; min-width: 0; height: 4px; border-radius: 2px; background: rgba(255,255,255,.06); overflow: hidden; }
  .lap-row .gap .bar i { display: block; height: 100%; width: calc(var(--w) * 100%); background: var(--yellow); border-radius: 2px; }
  .lap-row .gap em { font-style: normal; font-size: 12px; color: var(--yellow); min-width: 4.2rem; text-align: right; }
  .lap-row.best .gap em { color: var(--purple); }
  .lap-row .secs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 12.5px; color: var(--dim); text-align: right; }
  .lap-row .vmax { text-align: right; font-weight: 600; }
  .lap-row .vmax.top { color: var(--purple); }
  .lap-row .chev { color: var(--faint); font-size: 18px; line-height: 1; text-align: right; }
  .lap-row.nodata { cursor: default; opacity: .55; }
  .lap-row.nodata .chev { visibility: hidden; }
  @media (max-width: 860px) {
    .lap-row { grid-template-columns: 2.2rem 6rem minmax(0, 1fr) 4.2rem 0.8rem; }
    .lap-row .secs { display: none; }
  }
  @media (max-width: 460px) {
    .lap-row { grid-template-columns: 1.8rem 5.6rem minmax(0, 1fr) 3.4rem; gap: 10px; padding-inline: 14px; }
    .lap-row .chev { display: none; }
    .lap-row .time { font-size: 15px; }
    .lap-row .gap .bar { display: none; }
    .lap-row .gap em { min-width: 0; }
  }

  /* ---- lap detail */
  .crumbs { display: flex; align-items: center; gap: 10px; }
  .crumbs .end { margin-left: auto; display: flex; gap: 8px; }
  .lap-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .lap-title .time { font-size: 34px; font-weight: 800; }
  .lap-title .tag { font-size: 11px; font-weight: 800; letter-spacing: .14em; padding: 3px 9px; border-radius: 999px;
                    background: rgba(180,92,255,.16); color: var(--purple); }
  .lap-title .tag.slow { background: rgba(245,217,43,.12); color: var(--yellow); }
  .sectors { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .sectors > span { background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 4px 10px; font-size: 12.5px; }
  .sectors > span b { font-size: 10px; letter-spacing: .12em; color: var(--dim); margin-right: 6px; }
  .compare { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .key-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }

  .split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
  @media (max-width: 960px) { .split { grid-template-columns: minmax(0, 1fr); } }
  canvas { display: block; width: 100%; touch-action: pan-y; }
  #map { height: 320px; }
  .map-foot { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 18px 14px; font-size: 11px; color: var(--dim); }
  .map-foot i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

  .readout { display: flex; gap: 18px; flex-wrap: wrap; min-height: 22px; font-size: 12px; color: var(--dim); }
  .readout b { color: var(--ink); font-weight: 700; margin-left: 4px; }
  .chart { position: relative; }
  .chart + .chart { border-top: 1px solid var(--line); }
  .chart .name { position: absolute; left: 46px; top: 6px; font-size: 10px; font-weight: 700; letter-spacing: .12em;
                 text-transform: uppercase; color: var(--faint); pointer-events: none; }
  .chart .val { position: absolute; right: 8px; top: 5px; display: flex; gap: 12px; font-size: 12px; font-weight: 600; pointer-events: none; }
  .more { display: flex; justify-content: center; padding-top: 14px; }

  details.panel > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px;
                            padding: 15px 18px; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary h3 { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  details.panel > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--dim);
                                   border-bottom: 2px solid var(--dim); transform: rotate(45deg); transition: transform .2s; }
  details.panel[open] > summary::after { transform: rotate(225deg); }
  details.panel[open] > summary { border-bottom: 1px solid var(--line); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 14px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: 0; }
  td .vs { display: block; font-size: 11px; }
  td.turn { font-weight: 800; color: var(--accent); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stats-grid div { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stats-grid strong { display: block; font-size: 20px; font-weight: 700; margin-top: 2px; }
  .stats-grid small { color: var(--dim); font-size: 12px; }

  .handoff { max-width: 620px; margin: 8vh auto 0; width: 100%; padding: 36px 28px; text-align: center;
             display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .handoff .tick { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px;
                   font-weight: 900; color: #0c1a10; background: var(--green); box-shadow: 0 0 24px rgba(60,232,90,.5); }
  .handoff h2 { margin: 0; font-size: 30px; font-weight: 900; text-transform: uppercase; }
  .handoff p { margin: 0 0 10px; color: var(--dim); max-width: 460px; }
  .handoff small { color: var(--faint); font-size: 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 13px; padding: 11px 26px; text-decoration: none; }
  .empty { color: var(--dim); padding: 40px 20px; text-align: center; }
  footer { color: var(--faint); font-size: 12px; padding-bottom: 32px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  footer button { background: none; border: 0; padding: 0; color: var(--dim); text-decoration: underline; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1 class="brand"><img src="/logo.svg" alt="">APEX<span>DASH</span></h1>
    <span class="status" id="status"><i></i><span></span></span>
  </div>
</header>

<main class="wrap">
  <!-- Eslesme: veri yokken tek ekran -->
  <section class="panel pair hidden" id="pairView">
    <div class="qr" id="qr"></div>
    <div>
      <span class="label" data-t="pairLabel"></span>
      <h2 id="pairCode"></h2>
      <ol>
        <li data-t="pair1"></li>
        <li data-t="pair2"></li>
        <li data-t="pair3"></li>
      </ol>
      <button class="btn" onclick="resetSession()" data-t="newCode"></button>
      <p style="margin:14px 0 0;font-size:13px;color:var(--dim)"><span data-t="noApp"></span> <a href="https://apps.apple.com/app/id6813199957" style="color:var(--ink)" data-t="appStore"></a></p>
    </div>
  </section>

  <!-- Yonlendirme: telefon eslesti, analiz telefonda acilir -->
  <section class="panel handoff hidden" id="handoffView">
    <div class="tick">✓</div>
    <span class="label" data-t="handoffLabel"></span>
    <h2 data-t="handoffTitle"></h2>
    <p data-t="handoffBody"></p>
    <a class="btn primary" id="handoffLink" href="#" data-t="handoffOpen"></a>
    <small id="handoffAddress"></small>
    <small data-t="handoffNote"></small>
  </section>

  <!-- 1. Oturum -->
  <section id="overview" class="hidden" style="display:flex;flex-direction:column;gap:20px">
    <div class="context">
      <div>
        <span class="label" id="sessionType"></span>
        <h2 id="trackTitle"></h2>
        <p id="trackMeta"></p>
      </div>
    </div>
    <div class="hero" id="hero"></div>
    <div class="panel">
      <div class="panel-head">
        <h3 data-t="laps"></h3>
        <span class="label" id="lapCount"></span>
        <div class="end">
          <span class="seg" id="sortSeg">
            <button data-s="lap" class="on" data-t="sortLap"></button>
            <button data-s="time" data-t="sortTime"></button>
          </span>
        </div>
      </div>
      <div class="laps" id="lapList"></div>
    </div>
  </section>

  <!-- 2. Tur -->
  <section id="lapView" class="hidden" style="display:flex;flex-direction:column;gap:20px">
    <div class="crumbs">
      <button class="btn" onclick="go(null)">‹ <span data-t="allLaps"></span></button>
      <div class="end">
        <button class="btn" id="prevLap" aria-label="previous">‹</button>
        <button class="btn" id="nextLap" aria-label="next">›</button>
      </div>
    </div>

    <div class="context">
      <div>
        <span class="label" id="lapLabel"></span>
        <div class="lap-title"><span class="time" id="lapTime"></span><span class="tag" id="lapTag"></span></div>
        <div class="sectors" id="lapSectors"></div>
      </div>
      <div class="end compare">
        <span class="label" data-t="compareWith"></span>
        <select class="btn" id="compareSel"></select>
      </div>
    </div>

    <div class="hero compact" id="lapHero"></div>

    <div class="split">
      <div class="panel">
        <div class="panel-head">
          <h3 data-t="trackMap"></h3>
          <div class="end">
            <span class="seg" id="mapMode">
              <button data-m="speed" class="on" data-t="mSpeed"></button>
              <button data-m="pedal" data-t="mPedal"></button>
              <button data-m="sector" data-t="mSector"></button>
            </span>
          </div>
        </div>
        <div class="panel-body" style="padding-bottom:10px"><canvas id="map"></canvas></div>
        <div class="map-foot" id="mapFoot"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3 data-t="telemetry"></h3>
          <div class="end readout" id="readout"></div>
        </div>
        <div class="panel-body">
          <div id="charts"></div>
          <div class="more"><button class="btn" id="moreBtn"></button></div>
        </div>
      </div>
    </div>

    <details class="panel" id="cornersBox">
      <summary><h3 data-t="corners"></h3><span class="label" id="cornerCount"></span></summary>
      <div class="table-wrap"><table id="corners"></table></div>
    </details>

    <details class="panel" id="energyBox">
      <summary><h3 data-t="energy"></h3></summary>
      <div class="panel-body"><div class="stats-grid" id="energy"></div></div>
    </details>
  </section>

  <footer id="footer" class="hidden">
    <span><span data-t="code"></span> <b id="codeFoot" style="color:var(--dim)"></b></span>
    <button onclick="resetSession()" data-t="newCode"></button>
    <span data-t="footNote"></span>
    <a href="https://www.apexdash.pro/privacy" data-t="privacy" style="color:var(--dim)"></a>
    <a href="https://apps.apple.com/app/id6813199957" data-t="appStore" style="color:var(--dim)"></a>
    <a href="https://github.com/bekir1184/ApexDash" style="color:var(--dim)">GitHub</a>
  </footer>
</main>

<script src="/qrcode.js"></script>
<script>
"use strict";

// ---------------------------------------------------------------- language
// Like the app: Turkish if the browser is Turkish, otherwise English.
// `?lang=tr` or `?lang=en` overrides the browser's language.
const forcedLanguage = new URLSearchParams(location.search).get("lang");
const TR = (forcedLanguage || navigator.language || "").toLowerCase().startsWith("tr");
document.documentElement.lang = TR ? "tr" : "en";
const L = (tr, en) => TR ? tr : en;
const TEXT = {
  pairLabel: L("Eşleştirme kodu", "Pairing code"),
  pair1: L("Telefonda Apex Dash'i aç, <b>Ayarlar → Telemetri sitesi</b>'ne gir.", "Open Apex Dash on your phone and go to <b>Settings → Telemetry site</b>."),
  pair2: L("<b>QR OKUT</b>'a bas ve bu QR kodunu okut.", "Tap <b>SCAN QR</b> and scan this code."),
  pair3: L("Telefon eşleşince analiz telefonundan açılır; bu cihaz ve telefon aynı Wi-Fi ağında olsun.", "Once paired, the analysis opens from your phone; keep this device and the phone on the same Wi-Fi."),
  newCode: L("Yeni kod", "New code"),
  laps: L("Turlar", "Laps"), sortLap: L("Sıra", "Order"), sortTime: L("Süre", "Time"),
  allLaps: L("Tüm turlar", "All laps"), compareWith: L("Karşılaştır", "Compare"),
  trackMap: L("Pist", "Track"), mSpeed: L("Hız", "Speed"), mPedal: L("Pedal", "Pedals"), mSector: L("Sektör", "Sectors"),
  telemetry: L("Telemetri", "Telemetry"), corners: L("Virajlar", "Corners"), energy: L("Enerji ve aero", "Energy & aero"),
  code: L("Kod", "Code"),
  handoffLabel: L("Eşleşti", "Paired"),
  handoffTitle: L("Analiz telefonunda açılıyor", "Opening the analysis on your phone"),
  handoffBody: L("Turlar artık doğrudan telefondan gelir. Bu bilgisayar ve telefon aynı Wi-Fi ağında olmalı.", "Laps now come straight from your phone. This computer and the phone must be on the same Wi-Fi network."),
  handoffOpen: L("Analizi aç", "Open analysis"),
  handoffNote: L("Adres telefonun yerel ağ adresidir; tarayıcı \"güvenli değil\" diyebilir, bu normaldir.", "The address is your phone on the local network; the browser may call it \"not secure\", which is expected."),

  return `${m}:${String(s).padStart(2, "0")}.${String(t).padStart(3, "0")}`;
};
const fmtSec = ms => ms ? (ms / 1000).toFixed(3) : "—";
const fmtGap = ms => `${ms >= 0 ? "+" : "−"}${(Math.abs(ms) / 1000).toFixed(3)}`;
const LAP_COLOURS = ["#3fd9c9", "#ff7a3d"];
const TRACKS = {0:"Melbourne",1:"Paul Ricard",2:"Shanghai",3:"Sakhir",4:L("Barselona","Barcelona"),5:L("Monako","Monaco"),6:"Montreal",

// ---------------------------------------------------------------- session
function newCode() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({ length: 6 }, () => a[Math.floor(Math.random() * a.length)]).join("");
}
function sessionId() {
  const params = new URLSearchParams(location.search);
  let id = (params.get("s") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (id.length < 4) id = (localStorage.getItem("apexdash-session") || "").toUpperCase();
  if (id.length < 4) id = newCode();
  try { localStorage.setItem("apexdash-session", id); } catch (_) {}
  params.set("s", id);
  history.replaceState(null, "", `${location.pathname}?${params}${location.hash}`);
  return id;
}
/** Whether the page is served by the phone itself (local network). Then there
 *  is no pairing; data comes from the same address. */
const LOCAL = location.port === "8777" || /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname);
const session = LOCAL ? "LOCAL" : sessionId();
// When opened from a file on a computer, the live API is used.
const API = !LOCAL && (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === "file:") ? "https://www.apexdash.pro" : "";
function resetSession() { try { localStorage.removeItem("apexdash-session"); } catch (_) {} location.href = location.pathname; }

// ---------------------------------------------------------------- state
const state = {
  laps: [], track: null, updatedAt: null, version: null, error: false, loaded: false, handoff: null,
  traces: new Map(),        // lap -> column arrays
  loading: new Map(),       // lap -> pending request
  missing: new Set(),       // laps whose trace the server does not have
  sort: "lap",
  lap: null, compare: null, // lap detail
  mapMode: "speed", showAll: false,
  orient: null, cursor: null, corners: []
};
const lapInfo = n => state.laps.find(l => l.lap === n);
const hasTrace = l => l && l.trace && !state.missing.has(l.lap);
const topSpeedOf = l => l?.vmax ?? state.traces.get(l?.lap)?.vmax ?? null;

async function poll() {
  try {
    const r = await fetch(`${API}/api/session?id=${session}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    state.error = false;
    // If the phone announced its local address, the analysis opens there and cloud polling stops.
    if (!LOCAL && typeof data.local === "string") {
      state.handoff = data.local;
      state.loaded = true;
      stopPolling();
      render(); renderStatus();
      return;
    }
    const stamp = data.version ?? data.updatedAt ?? null;
    const changed = stamp !== state.version;
    state.version = stamp;
    state.updatedAt = data.updatedAt || null;
    state.laps = (data.laps || []).filter(l => l.time > 0);
    state.track = data.track || null;
    if (changed || !state.loaded) { state.loaded = true; render(); }
    fillTopSpeeds();
  } catch (_) { state.error = true; }
  renderStatus();
}

function renderStatus() {
  const el = $("status"), text = el.querySelector("span");
  el.classList.remove("live", "error");
  if (LOCAL) {
    el.classList.add(state.error ? "error" : "live");
    text.textContent = state.error ? L("Telefona ulaşılamıyor", "Phone unreachable") : L("Canlı · telefon", "Live · phone");
    return;
  }
  if (state.handoff) { el.classList.add("live"); text.textContent = L("Telefon eşleşti", "Phone paired"); return; }
  if (state.error) { el.classList.add("error"); text.textContent = L("Bağlantı yok", "Offline"); return; }
  if (!state.updatedAt) { text.textContent = L("Telefon bekleniyor", "Waiting for phone"); return; }
  const age = Date.now() - new Date(state.updatedAt).getTime();
  if (age < 3 * 60 * 1000) { el.classList.add("live"); text.textContent = L("Canlı", "Live"); return; }
  text.textContent = `${L("Son veri", "Last data")} ${ago(age)}`;
}
function ago(ms) {
  const m = Math.round(ms / 60000), h = Math.round(ms / 3600000), d = Math.round(ms / 86400000);
  if (m < 60) return L(`${m} dk önce`, `${m} min ago`);
  if (h < 48) return L(`${h} sa önce`, `${h} h ago`);
  return L(`${d} gün önce`, `${d} days ago`);
}

/** Downloads a trace and splits it into columns; one request per lap. */
function loadTrace(lap) {
  const info = lapInfo(lap);
  if (!hasTrace(info)) return Promise.resolve(null);
  const have = state.traces.get(lap);
  if (have && (!have.time || have.time === info.time)) return Promise.resolve(have);
  if (state.loading.has(lap)) return state.loading.get(lap);
  const p = fetch(`${API}/api/session?id=${session}&lap=${lap}`, { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(json => {
      if (!json?.rows?.length) { state.missing.add(lap); return null; }
      const tr = columnise(json, info);
      state.traces.set(lap, tr);
      return tr;
    })
    .catch(() => null)
    .finally(() => state.loading.delete(lap));
  state.loading.set(lap, p);
  return p;
}

/** Older sessions lack top speed in the lap list; it is filled in from traces, two at a time. */
let filling = false;
async function fillTopSpeeds() {
  if (filling) return;
  filling = true;
  try {
    const todo = state.laps.filter(l => hasTrace(l) && l.vmax == null && !state.traces.has(l.lap)).reverse();
    for (let k = 0; k < todo.length; k += 2) {
      await Promise.all(todo.slice(k, k + 2).map(l => loadTrace(l.lap)));
      if (route() == null) renderOverview();
    }
  } finally { filling = false; }
}

/** Turns row arrays into column arrays sorted by distance. */
function columnise(trace, info) {
  const cols = trace.columns, rows = trace.rows.slice().sort((a, b) => a[1] - b[1]);
  const out = { n: rows.length, time: trace.time };
  cols.forEach((c, i) => out[c] = Float64Array.from(rows, r => r[i]));
  const n = out.n;
  // Teleports and rewinds: a jump over 60 m breaks the line; isolated samples
  // cut off on both sides (a stale position before the lap) are dropped.
  const jump = new Float64Array(n);
  for (let i = 1; i < n; i++) jump[i] = Math.hypot(out.x[i] - out.x[i - 1], out.z[i] - out.z[i - 1]);
  out.brk = new Uint8Array(n); out.ok = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const before = i === 0 || jump[i] > 60, after = i === n - 1 || jump[i + 1] > 60;
    out.brk[i] = before ? 1 : 0;
    out.ok[i] = before && after ? 0 : 1;
  }
  const sectors = info?.sectors || [];
  const s1 = sectors[0] || Infinity, s2 = s1 + (sectors[1] || Infinity);
  out.sec = Uint8Array.from(out.t, t => t < s1 ? 0 : t < s2 ? 1 : 2);
  let vmax = 0; for (let i = 0; i < n; i++) if (out.ok[i] && out.v[i] > vmax) vmax = out.v[i];
  out.vmax = vmax;
  return out;
}

// ---------------------------------------------------------------- routing
const route = () => { const m = location.hash.match(/tur\/(\d+)/); return m ? Number(m[1]) : null; };
function go(lap, replace = false) {
  const url = `${location.pathname}${location.search}${lap == null ? "" : `#tur/${lap}`}`;
  if (lap == null && history.state?.fromList) { history.back(); return; }
  if (replace) history.replaceState(history.state, "", url);
  else history.pushState({ fromList: lap != null }, "", url);
  render();
  window.scrollTo({ top: 0 });
}
window.addEventListener("popstate", render);

function render() {
  if (!state.loaded) return;
  $("handoffView").classList.toggle("hidden", !state.handoff);
  if (state.handoff) {
    ["pairView", "overview", "lapView", "footer"].forEach(id => $(id).classList.add("hidden"));
    renderHandoff();
    return;
  }
  const hasData = state.laps.length > 0;
  const lap = route();
  $("pairView").classList.toggle("hidden", hasData || !!state.updatedAt);
  $("footer").classList.toggle("hidden", !hasData && !state.updatedAt);
  if ($("codeFoot")) $("codeFoot").textContent = session;
  if (!hasData) {
    $("overview").classList.add("hidden"); $("lapView").classList.add("hidden");
    if (!state.updatedAt) renderPair();
    else { $("overview").classList.remove("hidden"); renderOverview(); }
    return;
  }
  const showLap = lap != null && lapInfo(lap);
  $("overview").classList.toggle("hidden", !!showLap);
  $("lapView").classList.toggle("hidden", !showLap);
  if (showLap) renderLapView(lap); else renderOverview();
}

let handoffTimer = 0;
function renderHandoff() {
  const target = state.handoff;
  $("handoffLink").href = target;
  $("handoffAddress").textContent = target.replace(/\/$/, "");
  // Moves on its own if the browser allows it; otherwise there is a button.
  if (!handoffTimer) handoffTimer = setTimeout(() => { location.href = target; }, 1500);
}

function renderPair() {
  $("pairCode").textContent = session;
  if ($("qr").dataset.code === session) return;
  const qr = qrcode(0, "M");
  qr.addData(`${location.origin}/?s=${session}`);
  qr.make();
  $("qr").innerHTML = qr.createImgTag(5, 8);
  $("qr").dataset.code = session;
}

// ---------------------------------------------------------------- 1. session
function sessionSummary() {
  const laps = state.laps;
  if (!laps.length) return null;
  const best = laps.reduce((a, b) => b.time < a.time ? b : a);
  const bestS = [0, 1, 2].map(i => {
    const v = laps.map(l => l.sectors?.[i]).filter(x => x > 0);
    return v.length ? Math.min(...v) : null;
  });
  const theoretical = bestS.every(Boolean) ? bestS.reduce((a, b) => a + b, 0) : null;
  let fastest = null;
  laps.forEach(l => { const v = topSpeedOf(l); if (v != null && (!fastest || v > fastest.v)) fastest = { lap: l.lap, v }; });
  const times = laps.map(l => l.time).sort((a, b) => a - b);
  const median = times[Math.floor(times.length / 2)];
  return { best, bestS, theoretical, fastest, median, worst: times[times.length - 1] };
}

function renderOverview() {
  const t = state.track, sum = sessionSummary();
  $("sessionType").textContent = t ? (SESSIONS[t.sessionType] || L("Oturum", "Session")) : L("Oturum", "Session");
  $("trackTitle").textContent = t?.name ? t.name
    : t && t.id >= 0 ? (TRACKS[t.id] || `${L("Pist", "Track")} #${t.id}`) : L("Pist bekleniyor", "Waiting for track");
  $("trackMeta").textContent = t ? [
    t.length ? `${(t.length / 1000).toFixed(3)} km` : null,
    WEATHER[t.weather],
    t.trackTemp != null ? `${L("Pist", "Track")} ${t.trackTemp}°` : null,
    t.airTemp != null ? `${L("Hava", "Air")} ${t.airTemp}°` : null
  ].filter(Boolean).join("  ·  ") : "";

  if (!sum) {
    // The phone is paired but there are no laps yet.
    $("sessionType").innerHTML = `<span class="green">● ${L("Telefon bağlandı", "Phone connected")}</span>`;
    if (!t || t.id < 0) $("trackTitle").textContent = L("İlk tur bekleniyor", "Waiting for the first lap");
    $("hero").innerHTML = "";
    $("sortSeg").classList.add("hidden");
    $("lapCount").textContent = "";
    $("lapList").innerHTML = `<div class="empty">${L("Oyunda UDP telemetrisi açık olsun ve bir tur tamamla; tur bittiğinde süreler ve telemetri burada belirir.", "Make sure UDP telemetry is on in the game and complete a lap; times and telemetry appear here when it ends.")}</div>`;
    return;
  }

  const gain = sum.theoretical ? sum.best.time - sum.theoretical : null;
  $("hero").innerHTML = [
    card({ key: true, lap: sum.best.lap, label: L("En iyi tur", "Best lap"), value: fmtLap(sum.best.time),
           sub: `${L("Tur", "Lap")} ${sum.best.lap}` }),
    card({ label: L("Teorik en iyi", "Theoretical best"), value: fmtLap(sum.theoretical),
           sub: gain > 0 ? `<span class="green">${fmtGap(-gain)}</span> ${L("en iyi sektörlerle", "from best sectors")}` : L("En iyi sektörlerin toplamı", "Sum of best sectors") }),
    card({ lap: sum.fastest?.lap, label: L("En yüksek hız", "Top speed"),
           value: sum.fastest ? `${Math.round(sum.fastest.v)}<small>km/h</small>` : "—",
           sub: sum.fastest ? `${L("Tur", "Lap")} ${sum.fastest.lap}` : L("Tur izleri yükleniyor", "Loading lap traces") }),
    card({ label: L("Turlar", "Laps"), value: String(state.laps.length),
           sub: `${L("Ortanca", "Median")} ${fmtLap(sum.median)}` })
  ].join("");
  $("hero").querySelectorAll("button[data-lap]").forEach(b => b.onclick = () => go(Number(b.dataset.lap)));

  $("sortSeg").classList.remove("hidden");
  renderLapList(sum);
}

function card({ key, lap, label, value, sub }) {
  const tag = lap != null && hasTrace(lapInfo(lap)) ? "button" : "div";
  return `<${tag} class="card ${key ? "key" : ""}" ${tag === "button" ? `data-lap="${lap}"` : ""}>
    <span class="label">${label}</span><span class="value">${value}</span><span class="sub">${sub}</span></${tag}>`;
}

function renderLapList(sum) {
  const laps = state.laps.slice();
  if (state.sort === "time") laps.sort((a, b) => a.time - b.time); else laps.reverse();
  $("lapCount").textContent = `${state.laps.length}`;
  // Gap bar: against the best lap; outliers beyond two and a half times the median gap (out laps) are capped.
  const scale = Math.max(1000, Math.min(sum.worst - sum.best.time, (sum.median - sum.best.time) * 2.5));
  const head = `<div class="lap-row head"><span>${L("Tur", "Lap")}</span><span>${L("Süre", "Time")}</span>
    <span>${L("Fark", "Gap")}</span><span class="secs"><span>S1</span><span>S2</span><span>S3</span></span>
    <span style="text-align:right">km/h</span><span class="chev"></span></div>`;
  const rows = laps.map(l => {
    const isBest = l === sum.best, gap = l.time - sum.best.time, v = topSpeedOf(l);
    const secs = [0, 1, 2].map(i => {
      const s = l.sectors?.[i];
      return `<span class="${s && s === sum.bestS[i] ? "purple" : ""}">${fmtSec(s)}</span>`;
    }).join("");
    const ok = hasTrace(l);
    return `<button class="lap-row ${isBest ? "best" : ""} ${ok ? "" : "nodata"}" data-lap="${l.lap}" ${ok ? "" : "disabled"}>
      <span class="no">${l.lap}</span>
      <span class="time">${fmtLap(l.time)}</span>
      <span class="gap"><span class="bar"><i style="--w:${isBest ? 0 : Math.min(gap / scale, 1).toFixed(3)}"></i></span>
        <em>${isBest ? L("EN İYİ", "BEST") : fmtGap(gap)}</em></span>
      <span class="secs">${secs}</span>
      <span class="vmax ${v != null && sum.fastest && v === sum.fastest.v ? "top" : ""}">${v != null ? Math.round(v) : "—"}</span>
      <span class="chev">›</span>
    </button>`;
  }).join("");
  $("lapList").innerHTML = head + rows;
  $("lapList").querySelectorAll("button.lap-row").forEach(b => b.onclick = () => go(Number(b.dataset.lap)));
}
$("sortSeg").querySelectorAll("button").forEach(b => b.onclick = () => {
  state.sort = b.dataset.s;
  $("sortSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  renderOverview();
});

// ---------------------------------------------------------------- 2. lap
let lapRender = 0;
async function renderLapView(lap) {
  const token = ++lapRender;
  const sum = sessionSummary(), info = lapInfo(lap);
  if (state.lap !== lap) {
    state.lap = lap; state.cursor = null;
    state.compare = sum.best.lap !== lap && hasTrace(sum.best) ? sum.best.lap : null;
  }
  // header right away, charts once the trace arrives
  const gap = info.time - sum.best.time;
  $("lapLabel").textContent = `${L("Tur", "Lap")} ${lap}`;
  $("lapTime").textContent = fmtLap(info.time);
  $("lapTag").textContent = gap === 0 ? L("EN İYİ TUR", "BEST LAP") : fmtGap(gap);
  $("lapTag").classList.toggle("slow", gap !== 0);
  $("lapSectors").innerHTML = [0, 1, 2].map(i => {
    const s = info.sectors?.[i];
    return `<span><b>S${i + 1}</b><span class="${s && s === sum.bestS[i] ? "purple" : ""}">${fmtSec(s)}</span></span>`;
  }).join("");

  const ordered = state.laps.map(l => l.lap);
  const idx = ordered.indexOf(lap);
  const prev = ordered.slice(0, idx).reverse().find(n => hasTrace(lapInfo(n)));
  const next = ordered.slice(idx + 1).find(n => hasTrace(lapInfo(n)));
  $("prevLap").disabled = prev == null; $("prevLap").onclick = () => go(prev, true);
  $("nextLap").disabled = next == null; $("nextLap").onclick = () => go(next, true);

  $("compareSel").innerHTML = `<option value="">${L("Yok", "None")}</option>` + state.laps.slice()
    .sort((a, b) => a.time - b.time)
    .filter(l => l.lap !== lap && hasTrace(l))
    .map(l => `<option value="${l.lap}" ${l.lap === state.compare ? "selected" : ""}>${L("Tur", "Lap")} ${l.lap} · ${fmtLap(l.time)}${l === sum.best ? ` · ${L("en iyi", "best")}` : ""}</option>`)
    .join("");

  const [tr, cmp] = await Promise.all([loadTrace(lap), state.compare != null ? loadTrace(state.compare) : null]);
  if (token !== lapRender) return;
  if (!tr) {
    $("lapHero").innerHTML = `<div class="card" style="grid-column:1/-1"><span class="sub">${L("Bu turun izi bulunamadı.", "No trace for this lap.")}</span></div>`;
    return;
  }
  if (state.compare != null && !cmp) state.compare = null;
  state.orient = orientation(tr);
  state.corners = detectCorners(tr);
  renderLapHero(tr, cmp);
  drawMap();
  renderMapFoot();
  buildCharts();
  drawCharts();
  renderReadout();
  renderCorners();
  renderEnergy(tr, cmp);
}
$("compareSel").onchange = e => { state.compare = e.target.value ? Number(e.target.value) : null; state.cursor = null; renderLapView(state.lap); };

function lapStats(tr) {
  const n = tr.n;
  let full = 0, braking = 0, ov = 0, straight = 0, sumV = 0, k = 0;
  for (let i = 0; i < n; i++) {
    if (tr.th[i] > 0.95) full++;
    if (tr.br[i] > 0.05) braking++;
    if (tr.ov?.[i]) ov++;
    if (tr.ae?.[i]) straight++;
    if (tr.ok[i]) { sumV += tr.v[i]; k++; }
  }
  const dt = n > 1 ? (tr.t[n - 1] - tr.t[0]) / (n - 1) / 1000 : 0;
  return {
    top: tr.vmax, avg: k ? sumV / k : 0, full: full / n, braking: braking / n,
    ovSec: ov * dt, straight: straight / n,
    deployed: tr.dep ? Math.max(...tr.dep) : 0, ersEnd: tr.ers ? tr.ers[n - 1] : 0
  };
}
function diff(a, b, digits, unit, higherIsBetter) {
  if (b == null) return "";
  const d = a - b;
  if (Math.abs(d) < Math.pow(10, -digits) / 2) return `<span>= ${L("aynı", "same")}</span>`;
  const good = higherIsBetter ? d > 0 : d < 0;
  return `<span class="${good ? "green" : "yellow"}">${d > 0 ? "+" : "−"}${Math.abs(d).toFixed(digits)}${unit}</span> vs ${L("tur", "lap")} ${state.compare}`;
}
function renderLapHero(tr, cmp) {
  const a = lapStats(tr), b = cmp ? lapStats(cmp) : null;
  $("lapHero").innerHTML = [
    card({ key: true, label: L("En yüksek hız", "Top speed"), value: `${Math.round(a.top)}<small>km/h</small>`, sub: b ? diff(a.top, b.top, 0, " km/h", true) : "&nbsp;" }),
    card({ label: L("Ortalama hız", "Average speed"), value: `${Math.round(a.avg)}<small>km/h</small>`, sub: b ? diff(a.avg, b.avg, 1, " km/h", true) : "&nbsp;" }),

// ---------------------------------------------------------------- analysis
function interp(arr, dArr, d) {
  let lo = 0, hi = dArr.length - 1;
  if (d <= dArr[0]) return arr[0];
  if (d >= dArr[hi]) return arr[hi];
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (dArr[mid] <= d) lo = mid; else hi = mid; }
  const f = (d - dArr[lo]) / Math.max(dArr[hi] - dArr[lo], 1e-6);
  return arr[lo] + (arr[hi] - arr[lo]) * f;
}
function nearestIndex(dArr, d) {
  let lo = 0, hi = dArr.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (dArr[mid] <= d) lo = mid; else hi = mid; }
  return d - dArr[lo] < dArr[hi] - d ? lo : hi;
}

/** Track orientation: the longest straight horizontal, the body of the track above it. Rotation only, never mirrored. */
function orientation(tr) {
  const vmax = tr.vmax;
  let best = [0, 0];
  for (let i = 0; i < tr.n;) {
    if (tr.ok[i] && tr.v[i] >= 0.85 * vmax) {
      let j = i;
      while (j < tr.n && tr.ok[j] && !(j > i && tr.brk[j]) && tr.v[j] >= 0.85 * vmax) j++;
      if (j - i > best[1] - best[0]) best = [i, j];
      i = j;
    } else i++;
  }
  const [i, j] = best;
  if (j - i < 5) return { cos: 1, sin: 0 };
  const heading = Math.atan2(tr.z[j - 1] - tr.z[i], tr.x[j - 1] - tr.x[i]);
  const candidates = [Math.PI - heading, -heading];
  let cx = 0, cz = 0, k = 0;
  for (let q = 0; q < tr.n; q++) if (tr.ok[q]) { cx += tr.x[q]; cz += tr.z[q]; k++; }
  cx /= k; cz /= k;
  const mx = (tr.x[i] + tr.x[j - 1]) / 2, mz = (tr.z[i] + tr.z[j - 1]) / 2;
  for (const a of candidates) {
    const rz = (cx - mx) * Math.sin(a) + (cz - mz) * Math.cos(a);
    if (rz < 0) return { cos: Math.cos(a), sin: Math.sin(a) };
  }
  return { cos: Math.cos(candidates[0]), sin: Math.sin(candidates[0]) };
}
function mapPoint(x, z) {
  const o = state.orient || { cos: 1, sin: 0 };
  return [x * o.cos - z * o.sin, x * o.sin + z * o.cos];
}

/** Corners: local speed minimums with clear lateral G or steering. */
function detectCorners(tr) {
  const n = tr.n, corners = [];
  let i = 5;
  while (i < n - 5) {
    const v = tr.v[i];
    let isMin = true;
    for (let k = i - 5; k <= i + 5; k++) if (tr.v[k] < v) { isMin = false; break; }
    const turning = Math.abs(tr.gl?.[i] ?? 0) > 0.6 || Math.abs(tr.st?.[i] ?? 0) > 0.12;
    if (isMin && turning && v < 300 && tr.ok[i]) {
      const last = corners[corners.length - 1];
      if (!last || tr.d[i] - last.d > 90) {
        corners.push({ i, d: tr.d[i], x: tr.x[i], z: tr.z[i], v });
        i += 10; continue;
      }
    }
    i++;
  }
  return corners.map((c, k) => ({ ...c, n: k + 1 }));
}
function cornerStats(tr, corner) {
  const apexIdx = nearestIndex(tr.d, corner.d);
  let brakeIdx = -1;
  for (let k = apexIdx; k >= 0 && corner.d - tr.d[k] < 350; k--) if (tr.br[k] > 0.2) brakeIdx = k;
  const exitIdx = nearestIndex(tr.d, corner.d + 100);
  let minV = Infinity, minK = apexIdx;
  for (let k = Math.max(0, apexIdx - 15); k <= Math.min(tr.n - 1, apexIdx + 15); k++) if (tr.v[k] < minV) { minV = tr.v[k]; minK = k; }
  let gLat = 0;
  for (let k = Math.max(0, apexIdx - 10); k < Math.min(tr.n, apexIdx + 10); k++) gLat = Math.max(gLat, Math.abs(tr.gl?.[k] ?? 0));
  return {
    brake: brakeIdx >= 0 ? corner.d - tr.d[brakeIdx] : null,
    entry: brakeIdx >= 0 ? tr.v[brakeIdx] : tr.v[Math.max(0, apexIdx - 20)],
    apex: minV, exit: tr.v[exitIdx], gear: tr.g[minK], gLat
  };
}

// ---------------------------------------------------------------- map
function speedColour(f) {
  const stops = [[74, 163, 255], [60, 232, 90], [245, 217, 43], [255, 68, 56]];
  const p = Math.min(Math.max(f, 0), .999) * (stops.length - 1), k = Math.floor(p), t = p - k;
  return `rgb(${stops[k].map((v, j) => Math.round(v + (stops[k + 1][j] - v) * t)).join(",")})`;
}
const SECTOR_COLOURS = ["#ff4438", "#4aa3ff", "#f5d92b"];
const map = { canvas: $("map"), fit: null };

function drawMap() {
  const c = map.canvas, dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth;
  if (!w) return;
  const tr = state.traces.get(state.lap);
  if (!tr) { map.fit = null; c.getContext("2d").clearRect(0, 0, c.width, c.height); return; }

  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  const P = new Float64Array(tr.n * 2);
  for (let i = 0; i < tr.n; i++) {
    const [x, z] = mapPoint(tr.x[i], tr.z[i]);
    P[i * 2] = x; P[i * 2 + 1] = z;
    if (!tr.ok[i]) continue;
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
  }
  const pad = Math.max(22, w * 0.06);
  // Height follows the track's aspect ratio, so wide tracks leave no empty space.
  const aspect = (maxZ - minZ) / Math.max(maxX - minX, 1);
  const h = Math.round(Math.min(Math.max((w - pad * 2) * aspect + pad * 2, w * 0.6), w * 1.1, 620));
  if (c.style.height !== `${h}px`) c.style.height = `${h}px`;
  c.width = w * dpr; c.height = h * dpr;
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const s = Math.min((w - pad * 2) / Math.max(maxX - minX, 1), (h - pad * 2) / Math.max(maxZ - minZ, 1));
  const ox = (w - (maxX - minX) * s) / 2 - minX * s, oz = (h - (maxZ - minZ) * s) / 2 - minZ * s;
  map.fit = { px: x => x * s + ox, pz: z => z * s + oz };
  const at = i => [P[i * 2] * s + ox, P[i * 2 + 1] * s + oz];
  const line = Math.max(3, Math.min(7, w / 80));
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  ctx.beginPath();
  for (let i = 0; i < tr.n; i++) {
    if (!tr.ok[i]) continue;
    const [x, y] = at(i);
    if (tr.brk[i]) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = "#2a2a36"; ctx.lineWidth = line * 2.4; ctx.stroke();

  const minV = Math.min(...tr.v), range = Math.max(tr.vmax - minV, 1);
  for (let i = 1; i < tr.n; i++) {
    if (!tr.ok[i] || !tr.ok[i - 1] || tr.brk[i]) continue;
    let col;
    if (state.mapMode === "speed") col = speedColour((tr.v[i] - minV) / range);
    else if (state.mapMode === "pedal") col = tr.br[i] > 0.1 ? "#ff4438" : tr.th[i] > 0.9 ? "#3ce85a" : tr.th[i] > 0.1 ? "#9fd36a" : "#5d5d6e";
    else col = SECTOR_COLOURS[tr.sec[i]];
    const [x0, y0] = at(i - 1), [x1, y1] = at(i);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    ctx.strokeStyle = col; ctx.lineWidth = line; ctx.stroke();
  }

  let first = 0; while (first < tr.n - 1 && !tr.ok[first]) first++;
  { const [x, y] = at(first);
    ctx.beginPath(); ctx.arc(x, y, line * 0.9, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill(); }

  const r = Math.max(8, Math.min(11, w / 44));
  ctx.font = `700 ${Math.round(r * 1.05)}px Saira, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  state.corners.forEach(k => {
    const [kx, kz] = mapPoint(k.x, k.z), x = kx * s + ox, y = kz * s + oz;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "#121219"; ctx.fill(); ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#f1f2f5"; ctx.fillText(String(k.n), x, y + 0.5);
  });

  if (state.cursor != null) shownLaps().forEach(({ tr: t, colour }) => {
    const [x, z] = mapPoint(interp(t.x, t.d, state.cursor), interp(t.z, t.d, state.cursor));
    ctx.beginPath(); ctx.arc(x * s + ox, z * s + oz, 6.5, 0, Math.PI * 2);
    ctx.fillStyle = colour; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  });
}
function renderMapFoot() {
  const foot = {

    pedal: `<span><i style="background:#3ce85a"></i>${L("Tam gaz", "Full throttle")}</span><span><i style="background:#9fd36a"></i>${L("Kısmi gaz", "Part throttle")}</span><span><i style="background:#ff4438"></i>${L("Fren", "Brake")}</span><span><i style="background:#5d5d6e"></i>${L("Boşta", "Coasting")}</span>`,

map.canvas.addEventListener("pointermove", e => {
  const tr = state.traces.get(state.lap);

  const r = map.canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = -1, bd = Infinity;

// ---------------------------------------------------------------- charts
/** The core channels first; the rest open with "All channels". */
const CHARTS = [
  { key: "delta", name: L("Fark", "Delta"), h: 72, zero: true, needsCompare: true,
    get: (tr, cmp) => deltaSeries(tr, cmp), fmt: v => (v > 0 ? "+" : "") + v.toFixed(3) + " s" },
  { key: "v", name: L("Hız", "Speed"), h: 130, col: "v", fmt: v => Math.round(v) + " km/h" },
  { key: "th", name: L("Gaz", "Throttle"), h: 64, min: 0, max: 1, col: "th", fmt: v => Math.round(v * 100) + "%" },
  { key: "br", name: L("Fren", "Brake"), h: 64, min: 0, max: 1, col: "br", fmt: v => Math.round(v * 100) + "%" },
  { key: "g", name: L("Vites", "Gear"), h: 64, min: 0, max: 8, step: true, col: "g", fmt: v => String(Math.round(v)), more: true },
  { key: "st", name: L("Direksiyon", "Steering"), h: 64, min: -1, max: 1, zero: true, col: "st", fmt: v => Math.round(v * 100) + "%", more: true },
  { key: "rpm", name: L("Devir", "RPM"), h: 64, col: "rpm", fmt: v => Math.round(v) + "", more: true },
  { key: "gl", name: L("Yanal G", "Lateral G"), h: 64, zero: true, col: "gl", fmt: v => v.toFixed(2) + " g", more: true },
  { key: "ers", name: L("Batarya", "Battery"), h: 64, min: 0, col: "ers", fmt: v => (v / 1000).toFixed(2) + " MJ", more: true }

function deltaSeries(tr, cmp) {
  const out = new Float64Array(tr.n);
  if (!cmp) return out;
  for (let i = 0; i < tr.n; i++) out[i] = (tr.t[i] - interp(cmp.t, cmp.d, tr.d[i])) / 1000;
  return out;
}
function shownLaps() {
  const list = [];
  const a = state.traces.get(state.lap); if (a) list.push({ lap: state.lap, tr: a, colour: LAP_COLOURS[0] });
  const b = state.compare != null ? state.traces.get(state.compare) : null;

}
const activeCharts = () => CHARTS.filter(ch => (!ch.more || state.showAll) && (!ch.needsCompare || shownLaps().length > 1)
  && (ch.get || state.traces.get(state.lap)?.[ch.col]));

const chartEls = new Map();
const PADL = 42, PADR = 8;
function buildCharts() {
  const host = $("charts"), list = activeCharts();
  const signature = list.map(c => c.key).join();
  $("moreBtn").textContent = state.showAll ? L("Daha az kanal", "Fewer channels") : L("Tüm kanallar", "All channels");
  if (host.dataset.sig === signature) return;
  host.dataset.sig = signature;
  host.innerHTML = ""; chartEls.clear();
  list.forEach(ch => {
    const wrap = document.createElement("div");
    wrap.className = "chart";
    wrap.innerHTML = `<span class="name">${ch.name}</span><span class="val"></span><canvas style="height:${ch.h}px"></canvas>`;
    host.appendChild(wrap);
    const canvas = wrap.querySelector("canvas");
    canvas.addEventListener("pointermove", e => {
      const tr = state.traces.get(state.lap); if (!tr) return;
      const r = canvas.getBoundingClientRect();
      const f = (e.clientX - r.left - PADL) / (r.width - PADL - PADR);
      setCursor(Math.min(Math.max(f, 0), 1) * tr.d[tr.n - 1]);
    });
    canvas.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") setCursor(null); });
    chartEls.set(ch.key, { canvas, val: wrap.querySelector(".val") });
  });
}
$("moreBtn").onclick = () => { state.showAll = !state.showAll; buildCharts(); drawCharts(); renderReadout(); };

function seriesOf(ch, tr, cmp) { return ch.get ? ch.get(tr, cmp) : tr[ch.col]; }

function drawCharts() {
  const laps = shownLaps(), main = laps[0]?.tr, cmp = laps[1]?.tr;
  activeCharts().forEach(ch => {
    const el = chartEls.get(ch.key); if (!el) return;
    const { canvas } = el, dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = ch.h;
    if (!W) return;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!main) return;
    const maxD = main.d[main.n - 1], xs = d => PADL + d / maxD * (W - PADL - PADR);
    // The delta chart is a single line: the main lap against the comparison.
    const drawn = ch.needsCompare ? [{ tr: main, arr: seriesOf(ch, main, cmp), colour: "#f1f2f5" }]
      : laps.slice().reverse().map(l => ({ tr: l.tr, arr: seriesOf(ch, l.tr), colour: l.colour }));
    let lo = ch.min ?? Infinity, hi = ch.max ?? -Infinity;
    if (ch.min == null || ch.max == null) drawn.forEach(({ arr, tr }) => {
      for (let i = 0; i < arr.length; i++) if (tr.ok[i]) { if (ch.min == null && arr[i] < lo) lo = arr[i]; if (ch.max == null && arr[i] > hi) hi = arr[i]; }
    });
    if (!Number.isFinite(lo) || !Number.isFinite(hi)) return;
    if (hi - lo < 1e-6) hi = lo + 1;
    if (ch.zero && ch.min == null) { const m = Math.max(Math.abs(lo), Math.abs(hi)); lo = -m; hi = m; }
    const top = 22, bottom = 6, ys = v => top + (hi - v) / (hi - lo) * (H - top - bottom);

    ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 1;

    ctx.fillStyle = "#5d5d6e"; ctx.font = "600 9.5px Saira, sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(ch.fmt(hi).replace(/ .*/, ""), PADL - 6, ys(hi)); ctx.fillText(ch.fmt(lo).replace(/ .*/, ""), PADL - 6, ys(lo));
    if (ch.zero) { ctx.strokeStyle = "rgba(255,255,255,.2)"; ctx.beginPath(); ctx.moveTo(PADL, ys(0)); ctx.lineTo(W - PADR, ys(0)); ctx.stroke(); }

    if (ch.needsCompare) {
      // Green fill where ahead, yellow where behind.
      const z = ys(0), arr = drawn[0].arr;
      ["#3ce85a", "#f5d92b"].forEach((fill, side) => {
        ctx.beginPath(); ctx.moveTo(xs(main.d[0]), z);

          const v = side === 0 ? Math.min(arr[i], 0) : Math.max(arr[i], 0);

    }

}

    <th>${L("Giriş", "Entry")}</th><th>Apex</th><th>${L("Çıkış", "Exit")}</th><th>${L("Vites", "Gear")}</th><th>${L("Yanal G", "Lat G")}</th></tr>`;
  const cell = (a, b, fmt, higherIsBetter) => {
    if (a == null) return `<td>—</td>`;
    if (b === undefined) return `<td>${fmt(a)}</td>`;
    const good = higherIsBetter == null ? null : higherIsBetter ? a > b : a < b;
    const cls = good == null || Math.round(a) === Math.round(b) ? "" : good ? "green" : "yellow";
    if (b == null) return `<td>${fmt(a)}<span class="vs" style="color:${cmp.colour}">—</span></td>`;
    return `<td><span class="${cls}">${fmt(a)}</span><span class="vs" style="color:${cmp.colour}">${b == null ? "—" : fmt(b)}</span></td>`;
  };
  const rows = state.corners.map(k => {
    const a = cornerStats(laps[0].tr, k), b = cmp ? cornerStats(cmp.tr, k) : null;
    const pick = key => b ? b[key] ?? null : undefined;
    return `<tr><td class="turn">T${k.n}</td><td>${Math.round(k.d)} m</td>
      ${cell(a.brake, pick("brake"), v => `${Math.round(v)} m`, false)}
      ${cell(a.entry, pick("entry"), v => Math.round(v), true)}
      ${cell(a.apex, pick("apex"), v => Math.round(v), true)}
      ${cell(a.exit, pick("exit"), v => Math.round(v), true)}
      ${cell(a.gear, pick("gear"), v => v, null)}
      ${cell(a.gLat, pick("gLat"), v => v.toFixed(2), null)}</tr>`;
  }).join("");
  table.innerHTML = head + rows;
}

// ---------------------------------------------------------------- redraw
let resizeFrame = 0;
window.addEventListener("resize", () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => { if (route() != null) { drawMap(); drawCharts(); } });
});
document.fonts?.ready.then(() => { if (route() != null) { drawMap(); drawCharts(); } });
// ---------------------------------------------------------------- start
// Local: the page is served by the phone and asks it for data every 2 seconds.
// Live site: pairing only. The phone publishes its local address to an ntfy.sh
// topic unique to the code; the page listens and moves the browser to the phone.
// No server or storage is involved.
let pollTimer = 0;
function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    if (document.visibilityState === "visible") await poll();
    schedulePoll();
  }, 2000);
}
function stopPolling() { clearTimeout(pollTimer); pollTimer = -1; }

const PRIVATE_ADDRESS = /^http:\/\/(10\.\d+|172\.(1[6-9]|2\d|3[01])|192\.168)\.\d+\.\d+:\d{2,5}\/$/;
const pairTopic = `https://ntfy.sh/apexdash-${session}`;
function acceptPairing(message) {
  const address = String(message || "").trim();
  if (state.handoff || !PRIVATE_ADDRESS.test(address)) return;
  state.handoff = address;
  render(); renderStatus();
}
function listenForPhone() {
  // Also catches a pairing sent before the page opened.
  const since = "since=15m";
  try {
    const events = new EventSource(`${pairTopic}/sse?${since}`);
    events.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === "message") acceptPairing(m.message); } catch (_) {} };
    events.onerror = () => { state.error = events.readyState === EventSource.CLOSED; renderStatus(); };
  } catch (_) {}
  // Fallback: poll now and then if SSE is blocked.
  const check = async () => {
    if (state.handoff) return;
    try {
      const text = await (await fetch(`${pairTopic}/json?poll=1&${since}`, { cache: "no-store" })).text();
      text.split("\n").filter(Boolean).forEach(line => { try { acceptPairing(JSON.parse(line).message); } catch (_) {} });
    } catch (_) {}
    setTimeout(check, 8000);
  };
  setTimeout(check, 8000);
}

if (LOCAL) {
  document.querySelectorAll('[data-t="newCode"]').forEach(el => el.remove());
  $("codeFoot").parentElement.remove();
  $("footer").querySelector('[data-t="footNote"]').textContent = TEXT.localFoot;
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") poll(); });
  render(); renderStatus(); poll(); schedulePoll();
} else {
  state.loaded = true;
  render(); renderStatus();
  listenForPhone();
}
setInterval(renderStatus, 30000);
</script>
