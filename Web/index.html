<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1Dash · Telemetri</title>
<style>
  :root {
    --bg: #07090c; --panel: #0e1218; --panel2: #131922; --line: rgba(255,255,255,.08);
    --ink: #eef2f6; --dim: #7f8797; --purple: #b45cff; --green: #3ce85a; --yellow: #f5d92b;
    --red: #ff4438; --cyan: #3fd9c9; --blue: #4aa3ff;
    --c1: #3fd9c9; --c2: #ff7a3d; --c3: #b45cff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.45 "Inter", -apple-system, "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  b, th, .label { letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; color: var(--dim); font-weight: 700; }

  /* ---- ust cubuk */
  .top { display: flex; align-items: center; gap: 22px; padding: 12px 20px; border-bottom: 1px solid var(--line);
         background: linear-gradient(180deg, #0d1117, #090b0f); position: sticky; top: 0; z-index: 5; }
  .top h1 { margin: 0; font-size: 17px; letter-spacing: .32em; font-weight: 900; }
  .top h1 span { color: var(--cyan); }
  .top .meta { display: flex; gap: 22px; margin-left: auto; align-items: center; }
  .top .meta div { display: flex; flex-direction: column; line-height: 1.15; }
  .top .meta u { text-decoration: none; font-size: 14px; font-weight: 700; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); }
  .status.live i { background: var(--green); box-shadow: 0 0 8px var(--green); }

  /* ---- eslesme */
  .pair { display: flex; gap: 22px; align-items: center; margin: 18px 20px 0; background: var(--panel);
          border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .pair img { width: 176px; height: 176px; image-rendering: pixelated; background: #fff; padding: 8px; border-radius: 10px; }
  .pair .code { font-size: 34px; letter-spacing: .3em; font-weight: 900; }
  .pair p { margin: 6px 0 0; color: var(--dim); max-width: 460px; }
  .btn { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 999px;
         padding: 6px 14px; font: inherit; font-size: 11px; letter-spacing: .1em; cursor: pointer; }
  .btn:hover { color: var(--ink); border-color: var(--dim); }
  .hidden { display: none !important; }

  /* ---- yerlesim */
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 18px; padding: 18px 20px 60px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .18em; color: var(--dim); font-weight: 800;
              display: flex; align-items: center; gap: 10px; }
  .panel h2 .spacer { flex: 1; }

  /* ---- tur listesi */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  tr.lap { cursor: pointer; }
  tr.lap:hover td { background: rgba(255,255,255,.03); }
  tr.best td:nth-child(3) { color: var(--purple); font-weight: 700; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -2px; }
  .sw.on { border-color: transparent; }
  .gap { color: var(--yellow); font-size: 11px; }
  .purple { color: var(--purple); } .green { color: var(--green); }

  /* ---- ana alan */
  .main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .row { display: grid; grid-template-columns: minmax(300px, 440px) 1fr; gap: 18px; }
  @media (max-width: 1250px) { .row { grid-template-columns: 1fr; } }
  canvas { display: block; width: 100%; }
  #map { aspect-ratio: 1 / 1; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .stat { background: var(--panel2); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); }
  .stat u { display: block; text-decoration: none; font-size: 20px; font-weight: 800; margin-top: 4px; }
  .stat small { color: var(--dim); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--dim); }
  .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--dim); padding: 5px 10px; font: inherit; font-size: 10.5px;
                letter-spacing: .1em; cursor: pointer; }
  .seg button.on { background: rgba(63,217,201,.15); color: var(--cyan); }

  /* ---- grafikler */
  .charts { position: relative; }
  .chart { position: relative; margin-bottom: 4px; }
  .chart .name { position: absolute; left: 50px; top: 5px; }
  .chart .val { position: absolute; right: 8px; top: 6px; font-size: 11px; display: flex; gap: 12px; }
  .readout { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }
  .readout div { background: var(--panel2); border-radius: 8px; padding: 6px 10px; border: 1px solid var(--line); }
  .readout u { text-decoration: none; display: block; font-size: 15px; font-weight: 700; }

  /* ---- viraj tablosu */
  .corners td:first-child { font-weight: 800; color: var(--cyan); }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  footer { color: var(--dim); font-size: 11px; padding: 0 20px 30px; }
</style>
</head>
<body>

<div class="top">
  <h1>F1<span>DASH</span></h1>
  <span class="label">Telemetri Analizi</span>
  <div class="meta">
    <div><b>Pist</b><u id="trackName">—</u></div>
    <div><b>Hava</b><u id="weather">—</u></div>
    <div><b>Kod</b><u id="codeTop" class="mono">—</u></div>
    <span class="status" id="status"><i></i><span>Bekleniyor</span></span>
  </div>
</div>

<div class="pair" id="pair"></div>

<div class="grid">
  <aside class="panel">
    <h2>Turlar <span class="spacer"></span><span id="lapCount" class="label"></span></h2>
    <div id="laps"><div class="empty">Telefondan tur bekleniyor.</div></div>
  </aside>

  <section class="main">
    <div class="stats" id="stats"></div>

    <div class="row">
      <div class="panel">
        <h2>Pist Haritası <span class="spacer"></span>
          <span class="seg" id="mapMode">
            <button data-m="speed" class="on">Hız</button>
            <button data-m="pedal">Gaz / Fren</button>
            <button data-m="ers">ERS</button>
            <button data-m="sector">Sektör</button>
          </span>
        </h2>
        <canvas id="map"></canvas>
      </div>
      <div class="panel">
        <h2>Telemetri <span class="spacer"></span><span class="legend" id="legend"></span></h2>
        <div class="charts" id="charts"></div>
        <div class="readout" id="readout"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Virajlar <span class="spacer"></span><span class="label">Referans: <span id="refLap">—</span></span></h2>
      <div style="overflow-x:auto"><table class="corners" id="corners"></table></div>
    </div>
  </section>
</div>

<footer>Veri telefondaki F1Dash uygulamasından gelir. Bir tur bittiğinde 20 Hz'lik izi otomatik yüklenir; sayfa 3 saniyede bir yoklar.</footer>

<script src="/qrcode.js"></script>
<script>
"use strict";

// ---------------------------------------------------------------- yardimcilar
const $ = id => document.getElementById(id);
const fmtLap = ms => {
  if (!ms) return "--";
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), t = ms % 1000;
  return `${m}:${String(s).padStart(2, "0")}.${String(t).padStart(3, "0")}`;
};
const fmtSec = ms => ms ? (ms / 1000).toFixed(3) : "--";
const COLOURS = ["#3fd9c9", "#ff7a3d", "#b45cff"];
const TRACKS = {0:"Melbourne",1:"Paul Ricard",2:"Shanghai",3:"Sakhir",4:"Barselona",5:"Monako",6:"Montreal",
  7:"Silverstone",8:"Hockenheim",9:"Hungaroring",10:"Spa",11:"Monza",12:"Singapur",13:"Suzuka",14:"Abu Dabi",
  15:"Austin",16:"Interlagos",17:"Spielberg",18:"Soçi",19:"Meksiko",20:"Bakü",21:"Sakhir Kısa",22:"Silverstone Kısa",
  23:"Austin Kısa",24:"Suzuka Kısa",25:"Hanoi",26:"Zandvoort",27:"Imola",28:"Portimão",29:"Cidde",30:"Miami",
  31:"Las Vegas",32:"Losail",39:"Silverstone Ters",40:"Spielberg Ters",41:"Zandvoort Ters",42:"Madrid"};
const WEATHER = ["Açık", "Az bulutlu", "Kapalı", "Hafif yağmur", "Sağanak", "Fırtına"];

// ---------------------------------------------------------------- oturum
function newCode() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({ length: 6 }, () => a[Math.floor(Math.random() * a.length)]).join("");
}
function sessionId() {
  const params = new URLSearchParams(location.search);
  let id = (params.get("s") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (id.length < 4) id = (localStorage.getItem("f1dash-session") || "").toUpperCase();
  if (id.length < 4) id = newCode();
  localStorage.setItem("f1dash-session", id);
  params.set("s", id);
  history.replaceState(null, "", `${location.pathname}?${params}`);
  return id;
}
const session = sessionId();
$("codeTop").textContent = session;

function renderPair(connected) {
  const pair = $("pair");
  if (connected) { pair.classList.add("hidden"); return; }
  pair.classList.remove("hidden");
  const qr = qrcode(0, "M");
  qr.addData(`${location.origin}/?s=${session}`);
  qr.make();
  pair.innerHTML = `${qr.createImgTag(5, 8)}
    <div>
      <div class="code">${session}</div>
      <p>Telefondaki F1Dash uygulamasında <b>TURLAR</b> ekranını aç, <b>QR OKUT</b>'a bas ve bu kodu okut.
         Her tur bittiğinde tüm telemetri buraya kendiliğinden düşer.</p>
      <button class="btn" onclick="resetSession()">YENİ KOD</button>
    </div>`;
}
function resetSession() { localStorage.removeItem("f1dash-session"); location.href = location.pathname; }

// ---------------------------------------------------------------- durum
const state = {
  laps: [], track: null, updatedAt: null,
  selected: [],            // karsilastirilan tur numaralari (en fazla 3)
  traces: new Map(),       // lap -> {d,t,x,z,v,...} sutun dizileri
  loading: new Set(),
  mapMode: "speed",
  orient: null,
  cursor: null,            // mesafe (m)
  corners: []
};

async function poll() {
  try {
    const r = await fetch(`/api/session?id=${session}`, { cache: "no-store" });
    const data = await r.json();
    if (!data.updatedAt) return;
    const changed = data.updatedAt !== state.updatedAt;
    state.updatedAt = data.updatedAt;
    state.laps = data.laps || [];
    state.track = data.track || null;
    renderPair(true);
    setStatus(true);
    if (changed) {
      renderHeader();
      if (!state.selected.length) autoSelect();
      renderLaps();
      await ensureTraces();
      renderAll();
    }
  } catch (_) { setStatus(false); }
}
function setStatus(live) {
  const el = $("status");
  el.classList.toggle("live", live);
  el.querySelector("span").textContent = live
    ? `Bağlı · ${new Date(state.updatedAt).toLocaleTimeString("tr-TR")}` : "Bağlantı yok";
}
function renderHeader() {
  const t = state.track;
  $("trackName").textContent = t ? (TRACKS[t.id] || (t.id >= 0 ? `Pist #${t.id}` : "—")) + (t.length ? ` · ${t.length} m` : "") : "—";
  $("weather").textContent = t ? `${WEATHER[t.weather] || "—"} · pist ${t.trackTemp}° · hava ${t.airTemp}°` : "—";
}

/** Ilk secim: en iyi tur + son tur. */
function autoSelect() {
  const withTrace = state.laps.filter(l => l.trace);
  if (!withTrace.length) return;
  const best = withTrace.reduce((a, b) => (b.time < a.time ? b : a));
  state.selected = [best.lap];
  const last = withTrace[withTrace.length - 1];
  if (last.lap !== best.lap) state.selected.push(last.lap);
}

async function ensureTraces() {
  await Promise.all(state.selected.map(async lap => {
    if (state.traces.has(lap) || state.loading.has(lap)) return;
    state.loading.add(lap);
    try {
      const r = await fetch(`/api/session?id=${session}&lap=${lap}`, { cache: "no-store" });
      if (r.ok) state.traces.set(lap, columnise(await r.json(), state.laps.find(l => l.lap === lap)));
      else markMissing(lap);
    } catch (_) { markMissing(lap); }
    finally { state.loading.delete(lap); }
  }));
  // Izi gelmemis turlar secimden duser; hic kalmazsa yeniden secilir.
  state.selected = state.selected.filter(l => state.traces.has(l));
  if (!state.selected.length) {
    autoSelect();
    if (state.selected.some(l => !state.traces.has(l))) return ensureTraces();
  }
  renderLaps();
}
function markMissing(lap) {
  const info = state.laps.find(l => l.lap === lap);
  if (info) info.trace = false;
}

/** Satir dizilerini sutun dizilerine cevirir ve mesafeye gore siralar. */
function columnise(trace, info) {
  const cols = trace.columns, rows = trace.rows.slice().sort((a, b) => a[1] - b[1]);
  const out = { n: rows.length, time: trace.time };
  cols.forEach((c, i) => out[c] = Float64Array.from(rows, r => r[i]));
  const n = out.n;
  // Isinlanma / geri sarma: ardisik ornekler arasi 60 m ustu sicrama cizgiyi
  // koparir; iki tarafi da kopuk tek ornekler (tur oncesi bayat konum) atilir.
  const jump = new Float64Array(n);
  for (let i = 1; i < n; i++) jump[i] = Math.hypot(out.x[i] - out.x[i - 1], out.z[i] - out.z[i - 1]);
  out.brk = new Uint8Array(n); out.ok = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const before = i === 0 || jump[i] > 60, after = i === n - 1 || jump[i + 1] > 60;
    out.brk[i] = before ? 1 : 0;
    out.ok[i] = before && after ? 0 : 1;
  }
  // Sektorler: tur bilgisindeki sureler uzerinden
  const sectors = info?.sectors || [];
  const s1 = sectors[0] || Infinity, s2 = s1 + (sectors[1] || Infinity);
  out.sec = Uint8Array.from(out.t, t => t < s1 ? 0 : t < s2 ? 1 : 2);
  return out;
}

/** Haritayi gercek pist cizimleri gibi yerlestirir: en uzun duz yatay, pist
 *  govdesi onun ustunde. Yalnizca dondurme yapilir (ayna yok), boylece pistin
 *  yonu korunur. Referans turdan bir kez hesaplanir, tum turlara uygulanir. */
function orientation(tr) {
  const vmax = Math.max(...tr.v);
  let best = [0, 0];
  for (let i = 0; i < tr.n;) {
    if (tr.ok[i] && tr.v[i] >= 0.85 * vmax) {
      let j = i;
      while (j < tr.n && tr.ok[j] && !(j > i && tr.brk[j]) && tr.v[j] >= 0.85 * vmax) j++;
      if (j - i > best[1] - best[0]) best = [i, j];
      i = j;
    } else i++;
  }
  const [i, j] = best;
  if (j - i < 5) return { cos: 1, sin: 0 };
  const heading = Math.atan2(tr.z[j - 1] - tr.z[i], tr.x[j - 1] - tr.x[i]);
  const candidates = [Math.PI - heading, -heading];   // duz sola ya da saga aksin
  let cx = 0, cz = 0, k = 0;
  for (let q = 0; q < tr.n; q++) if (tr.ok[q]) { cx += tr.x[q]; cz += tr.z[q]; k++; }
  cx /= k; cz /= k;
  const mx = (tr.x[i] + tr.x[j - 1]) / 2, mz = (tr.z[i] + tr.z[j - 1]) / 2;
  for (const a of candidates) {
    const rz = (cx - mx) * Math.sin(a) + (cz - mz) * Math.cos(a);
    if (rz < 0) return { cos: Math.cos(a), sin: Math.sin(a) };   // govde ustte (ekranda -y)
  }
  return { cos: Math.cos(candidates[0]), sin: Math.sin(candidates[0]) };
}
function mapXY(tr, i) {
  const o = state.orient || { cos: 1, sin: 0 };
  return [tr.x[i] * o.cos - tr.z[i] * o.sin, tr.x[i] * o.sin + tr.z[i] * o.cos];
}
function mapPoint(x, z) {
  const o = state.orient || { cos: 1, sin: 0 };
  return [x * o.cos - z * o.sin, x * o.sin + z * o.cos];
}

// ---------------------------------------------------------------- tur listesi
function renderLaps() {
  const laps = state.laps;
  $("lapCount").textContent = laps.length ? `${laps.length} tur` : "";
  if (!laps.length) { $("laps").innerHTML = `<div class="empty">Telefondan tur bekleniyor.</div>`; return; }
  const best = Math.min(...laps.map(l => l.time));
  const bestS = [0, 1, 2].map(i => Math.min(...laps.map(l => l.sectors?.[i] || Infinity)));
  const rows = laps.slice().reverse().map(l => {
    const idx = state.selected.indexOf(l.lap);
    const sw = `<span class="sw ${idx >= 0 ? "on" : ""}" style="${idx >= 0 ? `background:${COLOURS[idx]}` : ""}"></span>`;
    const sectors = (l.sectors || []).map((v, i) => `<td class="mono ${v && v === bestS[i] ? "purple" : ""}">${fmtSec(v)}</td>`).join("");
    const gap = l.time === best ? "" : `+${((l.time - best) / 1000).toFixed(3)}`;
    return `<tr class="lap ${l.time === best ? "best" : ""}" data-lap="${l.lap}" title="${l.trace ? "Karşılaştırmaya ekle" : "İz henüz yüklenmedi"}">
      <td>${sw}</td><td class="mono">${l.lap}</td><td class="mono">${fmtLap(l.time)}</td>${sectors}<td class="gap mono">${gap}</td></tr>`;
  }).join("");
  $("laps").innerHTML = `<table><tr><th></th><th>Tur</th><th>Süre</th><th>S1</th><th>S2</th><th>S3</th><th>Fark</th></tr>${rows}</table>`;
  $("laps").querySelectorAll("tr.lap").forEach(tr => tr.onclick = () => toggleLap(Number(tr.dataset.lap)));
}
async function toggleLap(lap) {
  const info = state.laps.find(l => l.lap === lap);
  if (!info?.trace) return;
  const i = state.selected.indexOf(lap);
  if (i >= 0) state.selected.splice(i, 1);
  else { if (state.selected.length >= 3) state.selected.shift(); state.selected.push(lap); }
  renderLaps();
  await ensureTraces();
  renderAll();
}

// ---------------------------------------------------------------- analiz
function interp(arr, dArr, d) {
  // dArr artan; d icin dogrusal arama yerine ikili arama
  let lo = 0, hi = dArr.length - 1;
  if (d <= dArr[0]) return arr[0];
  if (d >= dArr[hi]) return arr[hi];
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (dArr[mid] <= d) lo = mid; else hi = mid; }
  const f = (d - dArr[lo]) / Math.max(dArr[hi] - dArr[lo], 1e-6);
  return arr[lo] + (arr[hi] - arr[lo]) * f;
}

/** Referans turda virajlar: hiz yerel minimumlari + belirgin yanal G / direksiyon. */
function detectCorners(tr) {
  if (!tr) return [];
  const n = tr.n, corners = [];
  let i = 5;
  while (i < n - 5) {
    const v = tr.v[i];
    let isMin = true;
    for (let k = i - 5; k <= i + 5; k++) if (tr.v[k] < v) { isMin = false; break; }
    const turning = Math.abs(tr.gl[i]) > 0.6 || Math.abs(tr.st[i]) > 0.12;
    if (isMin && turning && v < 300 && tr.ok[i]) {
      const last = corners[corners.length - 1];
      if (!last || tr.d[i] - last.d > 90) {
        corners.push({ i, d: tr.d[i], x: tr.x[i], z: tr.z[i], v });
        i += 10; continue;
      }
    }
    i++;
  }
  return corners.map((c, k) => ({ ...c, n: k + 1 }));
}

/** Bir virajin bir turdaki ozetleri: fren noktasi, giris/apex/cikis hizi, vites. */
function cornerStats(tr, corner) {
  const apexIdx = nearestIndex(tr.d, corner.d);
  let brakeIdx = -1;
  for (let k = apexIdx; k >= 0 && corner.d - tr.d[k] < 350; k--) if (tr.br[k] > 0.2) brakeIdx = k;
  const exitIdx = nearestIndex(tr.d, corner.d + 100);
  let minV = Infinity, minK = apexIdx;
  for (let k = Math.max(0, apexIdx - 15); k <= Math.min(tr.n - 1, apexIdx + 15); k++) if (tr.v[k] < minV) { minV = tr.v[k]; minK = k; }
  return {
    brake: brakeIdx >= 0 ? tr.d[brakeIdx] : null,
    entry: brakeIdx >= 0 ? tr.v[brakeIdx] : tr.v[Math.max(0, apexIdx - 20)],
    apex: minV, exit: tr.v[exitIdx], gear: tr.g[minK],
    gLat: Math.max(...Array.from(tr.gl.subarray(Math.max(0, apexIdx - 10), apexIdx + 10)).map(Math.abs))
  };
}
function nearestIndex(dArr, d) {
  let lo = 0, hi = dArr.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (dArr[mid] <= d) lo = mid; else hi = mid; }
  return d - dArr[lo] < dArr[hi] - d ? lo : hi;
}

function lapStats(tr) {
  if (!tr) return null;
  const n = tr.n;
  let full = 0, braking = 0, ov = 0, straight = 0, sumV = 0;
  for (let i = 0; i < n; i++) {
    if (tr.th[i] > 0.95) full++;
    if (tr.br[i] > 0.05) braking++;
    if (tr.ov[i]) ov++;
    if (tr.ae[i]) straight++;
    sumV += tr.v[i];
  }
  const dt = n > 1 ? (tr.t[n - 1] - tr.t[0]) / (n - 1) / 1000 : 0;
  return {
    top: Math.max(...tr.v), avg: sumV / n, full: full / n, braking: braking / n,
    ovSec: ov * dt, straight: straight / n,
    deployed: Math.max(...tr.dep), ersEnd: tr.ers[n - 1]
  };
}

// ---------------------------------------------------------------- cizim
function renderAll() {
  const ref = state.traces.get(state.selected[0]);
  state.orient = ref ? orientation(ref) : null;
  state.corners = detectCorners(ref);
  $("refLap").textContent = state.selected[0] ?? "—";
  renderStats();
  renderLegend();
  drawMap();
  buildCharts();
  drawCharts();
  renderCorners();
  renderReadout();
}

function renderStats() {
  const lap = state.selected[0], tr = state.traces.get(lap), st = lapStats(tr);
  if (!st) { $("stats").innerHTML = ""; return; }
  const info = state.laps.find(l => l.lap === lap) || {};
  const cards = [
    ["Tur " + lap, fmtLap(info.time), "süre"],
    ["En yüksek hız", `${Math.round(st.top)}`, "km/h"],
    ["Ortalama hız", `${Math.round(st.avg)}`, "km/h"],
    ["Tam gaz", `${Math.round(st.full * 100)}%`, "tur boyunca"],
    ["Fren", `${Math.round(st.braking * 100)}%`, "tur boyunca"],
    ["Overtake", `${st.ovSec.toFixed(1)} s`, "kullanım"],
    ["Düz mod", `${Math.round(st.straight * 100)}%`, "aktif aero"],
    ["ERS harcanan", `${(st.deployed / 1000).toFixed(2)} MJ`, `kalan ${(st.ersEnd / 1000).toFixed(2)} MJ`]
  ];
  $("stats").innerHTML = cards.map(([b, u, s]) => `<div class="stat"><b>${b}</b><u class="mono">${u}</u><small>${s}</small></div>`).join("");
}
function renderLegend() {
  $("legend").innerHTML = state.selected.map((lap, i) => `<span><i style="background:${COLOURS[i]}"></i>Tur ${lap}</span>`).join("");
}

function speedColour(f) {   // 0..1 -> mavi, yesil, sari, kirmizi
  const stops = [[74, 163, 255], [60, 232, 90], [245, 217, 43], [255, 68, 56]];
  const p = Math.min(Math.max(f, 0), .999) * (stops.length - 1), k = Math.floor(p), t = p - k;
  const c = stops[k].map((v, j) => Math.round(v + (stops[k + 1][j] - v) * t));
  return `rgb(${c.join(",")})`;
}

const map = { canvas: $("map"), fit: null };
function fitMap(tr) {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (let i = 0; i < tr.n; i++) {
    if (!tr.ok[i]) continue;
    const [x, z] = mapXY(tr, i);
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
  }
  const w = map.canvas.width, h = map.canvas.height, pad = 40;
  const s = Math.min((w - pad * 2) / Math.max(maxX - minX, 1), (h - pad * 2) / Math.max(maxZ - minZ, 1));
  return { s, ox: (w - (maxX - minX) * s) / 2 - minX * s, oz: (h - (maxZ - minZ) * s) / 2 - minZ * s,
           px: x => x * s + (w - (maxX - minX) * s) / 2 - minX * s,
           pz: z => z * s + (h - (maxZ - minZ) * s) / 2 - minZ * s };
}
function drawMap() {
  const c = map.canvas, dpr = window.devicePixelRatio || 1;
  const size = c.clientWidth;
  c.width = size * dpr; c.height = size * dpr;
  const ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
  const tr = state.traces.get(state.selected[0]);
  if (!tr) { map.fit = null; return; }
  map.fit = fitMap(tr);
  const { px, pz } = map.fit;
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  const at = i => { const [x, z] = mapXY(tr, i); return [px(x), pz(z)]; };
  // Pist govdesi (koyu); kopmalarda kalem kaldirilir
  ctx.beginPath();
  for (let i = 0; i < tr.n; i++) {
    if (!tr.ok[i]) continue;
    const [x, y] = at(i);
    if (tr.brk[i]) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = "#1c2430"; ctx.lineWidth = 16 * dpr; ctx.stroke();

  // Veri ile renkli cizgi
  const SECTOR = ["#ff4438", "#4aa3ff", "#f5d92b"];
  const maxV = Math.max(...tr.v), minV = Math.min(...tr.v);
  for (let i = 1; i < tr.n; i++) {
    if (!tr.ok[i] || !tr.ok[i - 1] || tr.brk[i]) continue;
    let col;
    if (state.mapMode === "speed") col = speedColour((tr.v[i] - minV) / Math.max(maxV - minV, 1));
    else if (state.mapMode === "pedal") col = tr.br[i] > 0.1 ? "#ff4438" : tr.th[i] > 0.9 ? "#3ce85a" : tr.th[i] > 0.1 ? "#9fd36a" : "#5b6472";
    else if (state.mapMode === "sector") col = SECTOR[tr.sec[i]];
    else col = tr.ov[i] ? "#4aa3ff" : tr.dep[i] > (tr.dep[i - 1] ?? 0) + 0.5 ? "#f5d92b" : tr.ers[i] > (tr.ers[i - 1] ?? 0) ? "#3fd9c9" : "#5b6472";
    const [x0, y0] = at(i - 1), [x1, y1] = at(i);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    ctx.strokeStyle = col; ctx.lineWidth = 7 * dpr; ctx.stroke();
  }

  // Start / finis: turun ilk gecerli noktasi
  let first = 0; while (first < tr.n - 1 && !tr.ok[first]) first++;
  { const [x, y] = at(first);
    ctx.beginPath(); ctx.arc(x, y, 6 * dpr, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill(); }

  // Viraj numaralari
  ctx.font = `${11 * dpr}px ui-monospace, Menlo, monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  state.corners.forEach(k => {
    const [kx, kz] = mapPoint(k.x, k.z);
    const x = px(kx), z = pz(kz);
    ctx.beginPath(); ctx.arc(x, z, 10 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = "#0b0f14"; ctx.fill(); ctx.strokeStyle = "#3fd9c9"; ctx.lineWidth = 1.5 * dpr; ctx.stroke();
    ctx.fillStyle = "#e8fbf9"; ctx.fillText(String(k.n), x, z + dpr * 0.5);
  });

  // Imlec noktalari
  if (state.cursor != null) state.selected.forEach((lap, i) => {
    const t = state.traces.get(lap); if (!t) return;
    const [x, z] = mapPoint(interp(t.x, t.d, state.cursor), interp(t.z, t.d, state.cursor));
    ctx.beginPath(); ctx.arc(px(x), pz(z), 7 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = COLOURS[i]; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2 * dpr; ctx.stroke();
  });
}
map.canvas.addEventListener("mousemove", e => {
  const tr = state.traces.get(state.selected[0]);
  if (!tr || !map.fit) return;
  const r = map.canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const mx = (e.clientX - r.left) * dpr, mz = (e.clientY - r.top) * dpr;
  let best = -1, bd = Infinity;
  for (let i = 0; i < tr.n; i += 2) {
    if (!tr.ok[i]) continue;
    const [x, z] = mapXY(tr, i);
    const dx = map.fit.px(x) - mx, dz = map.fit.pz(z) - mz, dd = dx * dx + dz * dz;
    if (dd < bd) { bd = dd; best = i; }
  }
  if (best >= 0 && bd < (30 * dpr) ** 2) setCursor(tr.d[best]);
});
map.canvas.addEventListener("mouseleave", () => setCursor(null));
$("mapMode").querySelectorAll("button").forEach(b => b.onclick = () => {
  state.mapMode = b.dataset.m;
  $("mapMode").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  drawMap();
});

// Grafik tanimlari: her biri mesafeye karsi bir ya da iki seri
const CHARTS = [
  { key: "delta", name: "Fark (s)", h: 70, series: [{ get: (tr, ref) => deltaSeries(tr, ref), unit: "s", fmt: v => (v > 0 ? "+" : "") + v.toFixed(3) }], zero: true },
  { key: "v", name: "Hız (km/h)", h: 120, series: [{ col: "v", unit: "km/h", fmt: v => Math.round(v) }] },
  { key: "pedal", name: "Gaz / Fren", h: 80, min: 0, max: 1, series: [{ col: "th", tint: "#3ce85a", unit: "", fmt: v => Math.round(v * 100) + "%" }, { col: "br", tint: "#ff4438", unit: "", fmt: v => Math.round(v * 100) + "%", dashed: false }] },
  { key: "st", name: "Direksiyon", h: 70, min: -1, max: 1, zero: true, series: [{ col: "st", unit: "", fmt: v => (v * 100).toFixed(0) + "%" }] },
  { key: "g", name: "Vites", h: 60, min: 0, max: 8, step: true, series: [{ col: "g", unit: "", fmt: v => String(Math.round(v)) }] },
  { key: "rpm", name: "Devir", h: 70, series: [{ col: "rpm", unit: "rpm", fmt: v => Math.round(v) }] },
  { key: "gl", name: "Yanal G", h: 70, zero: true, series: [{ col: "gl", unit: "g", fmt: v => v.toFixed(2) }] },
  { key: "ers", name: "ERS depo (kJ)", h: 70, min: 0, max: 4000, series: [{ col: "ers", unit: "kJ", fmt: v => Math.round(v) }, { col: "ov", tint: "#4aa3ff", scale: 4000, unit: "", fmt: v => v ? "OVERTAKE" : "" }] }
];

/** Referansa gore zaman farki: ayni mesafede gecen sure farki. */
function deltaSeries(tr, ref) {
  if (!ref || tr === ref) return tr.t.map(() => 0);
  const out = new Float64Array(tr.n);
  for (let i = 0; i < tr.n; i++) out[i] = (tr.t[i] - interp(ref.t, ref.d, tr.d[i])) / 1000;
  return out;
}

const chartEls = new Map();
function buildCharts() {
  const host = $("charts");
  if (!chartEls.size) {
    host.innerHTML = "";
    CHARTS.forEach(ch => {
      const wrap = document.createElement("div");
      wrap.className = "chart";
      wrap.innerHTML = `<span class="name label">${ch.name}</span><span class="val mono" data-k="${ch.key}"></span><canvas height="${ch.h}"></canvas>`;
      host.appendChild(wrap);
      const canvas = wrap.querySelector("canvas");
      canvas.addEventListener("mousemove", e => {
        const r = canvas.getBoundingClientRect();
        const f = (e.clientX - r.left - PADL) / (r.width - PADL - PADR);
        const ref = state.traces.get(state.selected[0]);
        if (ref) setCursor(Math.min(Math.max(f, 0), 1) * ref.d[ref.n - 1]);
      });
      canvas.addEventListener("mouseleave", () => setCursor(null));
      chartEls.set(ch.key, { canvas, wrap, val: wrap.querySelector(".val") });
    });
  }
}
const PADL = 44, PADR = 10;
function drawCharts() {
  const ref = state.traces.get(state.selected[0]);
  CHARTS.forEach(ch => {
    const { canvas } = chartEls.get(ch.key);
    const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = ch.h;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);
    if (!ref) return;
    const maxD = ref.d[ref.n - 1];
    const xs = d => PADL + d / maxD * (W - PADL - PADR);
    // seriler
    const drawn = [];
    let lo = ch.min ?? Infinity, hi = ch.max ?? -Infinity;
    state.selected.forEach((lap, li) => {
      const tr = state.traces.get(lap); if (!tr) return;
      ch.series.forEach((s, si) => {
        const raw = s.get ? s.get(tr, ref) : tr[s.col];
        const arr = s.scale ? Float64Array.from(raw, v => v * s.scale) : raw;
        drawn.push({ tr, arr, colour: s.tint && state.selected.length === 1 ? s.tint : (s.tint ? mix(COLOURS[li], s.tint) : COLOURS[li]), si });
        if (ch.min == null || ch.max == null) for (let i = 0; i < arr.length; i++) { if (arr[i] < lo) lo = arr[i]; if (arr[i] > hi) hi = arr[i]; }
      });
    });
    if (!Number.isFinite(lo) || !Number.isFinite(hi)) return;
    if (hi - lo < 1e-6) { hi = lo + 1; }
    if (ch.zero && ch.min == null) { const m = Math.max(Math.abs(lo), Math.abs(hi)); lo = -m; hi = m; }
    const ys = v => 8 + (hi - v) / (hi - lo) * (H - 16);
    // izgara
    ctx.strokeStyle = "rgba(255,255,255,.06)"; ctx.lineWidth = 1;
    [lo, (lo + hi) / 2, hi].forEach(v => { ctx.beginPath(); ctx.moveTo(PADL, ys(v)); ctx.lineTo(W - PADR, ys(v)); ctx.stroke(); });
    ctx.fillStyle = "#7f8797"; ctx.font = "9px ui-monospace, Menlo, monospace"; ctx.textAlign = "right";
    ctx.fillText(ch.series[0].fmt(hi), PADL - 6, ys(hi) + 3); ctx.fillText(ch.series[0].fmt(lo), PADL - 6, ys(lo) + 3);
    if (ch.zero) { ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.beginPath(); ctx.moveTo(PADL, ys(0)); ctx.lineTo(W - PADR, ys(0)); ctx.stroke(); }
    // viraj isaretleri
    ctx.strokeStyle = "rgba(63,217,201,.15)";
    state.corners.forEach(k => { ctx.beginPath(); ctx.moveTo(xs(k.d), 0); ctx.lineTo(xs(k.d), H); ctx.stroke(); });
    // cizgiler
    drawn.forEach(({ tr, arr, colour }) => {
      ctx.beginPath(); ctx.strokeStyle = colour; ctx.lineWidth = 1.6;
      for (let i = 0; i < tr.n; i++) {
        const x = xs(tr.d[i]), y = ys(Math.min(Math.max(arr[i], lo), hi));
        if (!i) ctx.moveTo(x, y); else if (ch.step) { ctx.lineTo(x, ys(arr[i - 1])); ctx.lineTo(x, y); } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    });
    // imlec
    if (state.cursor != null) {
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.beginPath(); ctx.moveTo(xs(state.cursor), 0); ctx.lineTo(xs(state.cursor), H); ctx.stroke();
    }
  });
}
function mix(a, b) { return b; }

function setCursor(d) {
  state.cursor = d;
  drawCharts();
  drawMap();
  renderReadout();
}
function renderReadout() {
  const ref = state.traces.get(state.selected[0]);
  const d = state.cursor;
  // grafik basliklarindaki anlik degerler
  CHARTS.forEach(ch => {
    const el = chartEls.get(ch.key)?.val; if (!el) return;
    if (d == null || !ref) { el.innerHTML = ""; return; }
    el.innerHTML = state.selected.map((lap, li) => {
      const tr = state.traces.get(lap); if (!tr) return "";
      const s = ch.series[0];
      const arr = s.get ? s.get(tr, ref) : tr[s.col];
      return `<span style="color:${COLOURS[li]}">${s.fmt(interp(arr, tr.d, d))}</span>`;
    }).join("");
  });
  if (d == null || !ref) { $("readout").innerHTML = ""; return; }
  const near = state.corners.filter(k => Math.abs(k.d - d) < 60)[0];
  $("readout").innerHTML = [
    ["Mesafe", `${Math.round(d)} m`], ["Viraj", near ? `T${near.n}` : "—"],
    ...state.selected.map((lap, li) => {
      const tr = state.traces.get(lap); if (!tr) return null;
      return [`Tur ${lap} süre`, `<span style="color:${COLOURS[li]}">${fmtLap(Math.round(interp(tr.t, tr.d, d)))}</span>`];
    }).filter(Boolean)
  ].map(([b, u]) => `<div><b>${b}</b><u class="mono">${u}</u></div>`).join("");
}

function renderCorners() {
  const table = $("corners");
  if (!state.corners.length) { table.innerHTML = `<tr><td class="empty">Referans turda viraj bulunamadı.</td></tr>`; return; }
  const laps = state.selected.filter(l => state.traces.has(l));
  const head = `<tr><th>Viraj</th><th>Mesafe</th>${laps.map((l, i) => `<th style="color:${COLOURS[i]}">Tur ${l} fren</th><th>Giriş</th><th>Apex</th><th>Çıkış</th><th>Vites</th><th>Yanal G</th>`).join("")}</tr>`;
  const rows = state.corners.map(k => {
    const cells = laps.map(l => {
      const s = cornerStats(state.traces.get(l), k);
      const brakeTxt = s.brake != null ? `${Math.round(k.d - s.brake)} m önce` : "—";
      return `<td class="mono">${brakeTxt}</td><td class="mono">${Math.round(s.entry)}</td><td class="mono">${Math.round(s.apex)}</td><td class="mono">${Math.round(s.exit)}</td><td class="mono">${s.gear}</td><td class="mono">${s.gLat.toFixed(2)}</td>`;
    }).join("");
    return `<tr><td>T${k.n}</td><td class="mono">${Math.round(k.d)} m</td>${cells}</tr>`;
  }).join("");
  table.innerHTML = head + rows;
}

window.addEventListener("resize", () => { drawMap(); drawCharts(); });
renderPair(false);
poll();
setInterval(poll, 3000);
</script>
